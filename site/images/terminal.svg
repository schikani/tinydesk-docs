<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 428" width="740" height="428" font-family="'DejaVu Sans Mono', Consolas, Menlo, 'Courier New', monospace" font-size="15">
<rect width="740" height="428" rx="10" fill="#1b1f27"/>
