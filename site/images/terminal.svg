<text x="99" y="230" textLength="9" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#3b78ff">~</text>
<text x="108" y="230" textLength="612" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#cccccc"># echo "6*7 = $((6*7))" | cat                                       </text>
