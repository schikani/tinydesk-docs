<text x="99" y="320" textLength="9" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#3b78ff">~</text>
<text x="108" y="320" textLength="612" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#cccccc"># board show                                                        </text>
