# TinyDesk documentation and web installer on nginx.
#
# Copy to /etc/nginx/sites-available/tinydesk, replace tinydesk.example.com
# and the paths, link it into sites-enabled, then:
#   sudo certbot --nginx -d tinydesk.example.com     # HTTPS certificate (Let's Encrypt)
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS is required: browsers allow the web installer (Web Serial) only on
# secure pages (https:// or localhost).

server {
    listen 80;
    listen [::]:80;
    server_name tinydesk.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tinydesk.example.com;

    # Written by certbot; adjust if you use another CA.
    ssl_certificate     /etc/letsencrypt/live/tinydesk.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tinydesk.example.com/privkey.pem;

    root /var/www/tinydesk;          # the contents of site/
    index index.html;

    gzip on;
    gzip_types text/markdown text/plain text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }

    # The pages are Markdown fetched by Docsify: always ask for the current one.
    location ~* \.md$ {
        default_type text/markdown;
        charset utf-8;
        add_header Cache-Control "no-cache";
    }

    # Manifests and the installer page change with every release.
    location ~* ^/install/(index\.html|manifest-.*\.json|SHA256SUMS\.txt|README\.txt)?$ {
        add_header Cache-Control "no-cache";
    }

    # Images and downloads carry the version in their names: cache them.
    location /install/firmware/ {
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=604800";
    }
    location /install/downloads/ {
        add_header Cache-Control "public, max-age=86400";
    }
}
